# OmniBot Open — Docker Compose
#
# Services:
#   robot     — ROS 2 base stack (driver + ROSBridge)
#   rosbridge — standalone ROSBridge WebSocket for the Android app
#
# Usage:
#   docker compose up robot           # start robot stack
#   docker compose up rosbridge       # standalone ROSBridge only (Pi)
#
# Note: VLA, RL, and AI services are not included in OmniBot Open.
# See OmniBot Pro for the full autonomy stack.

version: "3.9"

x-ros-env: &ros-env
  ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-30}
  ROS_DISTRO: jazzy
  RCUTILS_LOGGING_BUFFERED_STREAM: "1"

services:

  # ── Robot stack (Raspberry Pi 5 or development machine) ─────────────────
  robot:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
      target: dev
    image: omnibot/robot:latest
    network_mode: host
    privileged: true                     # needed for serial + USB devices
    volumes:
      - .:/home/ros/workspace:cached
      - /dev:/dev
    environment:
      <<: *ros-env
      # Set YAHBOOM_PORT in deployment.env (see deployment.env.example)
      YAHBOOM_PORT: ${YAHBOOM_PORT:-/dev/ttyUSB0}
    command: >
      bash -c "
        source /opt/ros/jazzy/setup.bash &&
        cd /home/ros/workspace/robot_ws &&
        colcon build --symlink-install --quiet &&
        source install/setup.bash &&
        ros2 launch omnibot_bringup robot.launch.py
      "
    restart: unless-stopped

  # ── Standalone ROSBridge (when robot service is not used) ────────────────
  rosbridge:
    image: osrf/ros:jazzy-ros-core
    network_mode: host
    environment:
      <<: *ros-env
    command: >
      bash -c "
        source /opt/ros/jazzy/setup.bash &&
        ros2 launch rosbridge_server rosbridge_websocket_launch.xml port:=9090
      "
    restart: unless-stopped
